# Memoria del proceso Gradle.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=windows-1252

# NOTA sobre `-Dfile.encoding=windows-1252`:
#   Gradle pasa el classpath de los procesos worker (los que ejecutan los tests)
#   mediante un archivo de argumentos `@archivo`. Java lo escribe con el
#   `file.encoding` del daemon, pero el lanzador de la JVM lo LEE con la
#   codificacion nativa del sistema (`sun.jnu.encoding`, Cp1252 en Windows
#   en espanol). Si ambos no coinciden y la ruta del usuario contiene
#   caracteres no ASCII (por ejemplo `C:\Users\SantiAgüero`), la ruta se
#   corrompe, el worker no encuentra `GradleWorkerMain` y los tests fallan con
#   "Could not find or load main class worker...GradleWorkerMain".
#   Al fijar el `file.encoding` del daemon a la codificacion nativa, ambos
#   lados coinciden. Si tu `sun.jnu.encoding` no es windows-1252, cambia este
#   valor por el tuyo (`java -XshowSettings:properties -version`). En un
#   sistema con HOME exclusivamente ASCII esta linea no es necesaria.
org.gradle.parallel=true
org.gradle.caching=true
